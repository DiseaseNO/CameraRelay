# XcodeGen-spesifikasjon. Selve .xcodeproj er GENERERT og ligger ikke i git —
# `xcodegen generate` lager den lokalt og i CI. Det holder prosjektfila fri for
# merge-konflikter og gjør at CI alltid bygger fra samme kilde.
name: CameraRelay
options:
  bundleIdPrefix: no.gustavs1
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    # Settes fra miljøet ved `xcodegen generate` — ikke hardkodet, så andre kan bygge
    # prosjektet med sin egen Apple-konto uten å endre fila.
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
targets:
  CameraRelay:
    type: application
    platform: iOS
    sources: [Sources]
    # Ekte Info.plist generert av XcodeGen, ikke INFOPLIST_KEY_*-byggeinnstillinger.
    # Grunnen: UISupportedInterfaceOrientations MÅ være en LISTE. Som byggeinnstilling
    # ble den skrevet som én kommaseparert streng, og App Store avviste bundlen med
    # «Invalid bundle. The "UIInterfaceOrientationPortrait,..." key ...».
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Camera
        UIUserInterfaceStyle: Dark
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Lyd i bakgrunnen — gir også Picture-in-Picture for AVPlayer.
        UIBackgroundModes:
          - audio
    settings:
      base:
        # Ett av to steder du må endre ved fork (det andre er DEVELOPMENT_TEAM).
        PRODUCT_BUNDLE_IDENTIFIER: no.gustavs1.camerarelay
        # Peker på Assets.xcassets/AppIcon.appiconset. Setter samtidig CFBundleIconName,
        # som App Store krever — uten den avvises opplastingen.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
