# XcodeGen-spesifikasjon. Selve .xcodeproj er GENERERT og ligger ikke i git —
# `xcodegen generate` lager den lokalt og i CI. Det holder prosjektfila fri for
# merge-konflikter og gjør at CI alltid bygger fra samme kilde.
name: CameraRelay
options:
  bundleIdPrefix: no.gustavs1
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    # Settes fra miljøet ved `xcodegen generate` — ikke hardkodet, så andre kan bygge
    # prosjektet med sin egen Apple-konto uten å endre fila.
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
targets:
  CameraRelay:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        # Ett av to steder du må endre ved fork (det andre er DEVELOPMENT_TEAM).
        PRODUCT_BUNDLE_IDENTIFIER: no.gustavs1.camerarelay
        # MÅ stå for at INFOPLIST_KEY_*-verdiene under skal bli til en faktisk Info.plist.
        # Uten den feiler signeringen med «target does not have an Info.plist file».
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Camera
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        # Lyd fortsetter når skjermen låses / appen går i bakgrunnen
        INFOPLIST_KEY_UIBackgroundModes: audio
